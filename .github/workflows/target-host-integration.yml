name: DSH 0.1.2-alpha.2 integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: target-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-target-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out approve-for-me
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-approve-for-me
      # Host source is needed only to rebuild the approval fork; the rest of
      # the target closure comes from the published 0.1.2-alpha.2 packages.
      - name: Check out pinned DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
          path: deepseek-harness
          fetch-depth: 0
      - name: Check out managed-agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: krysta1-maii/dsh-managed-agent
          ref: main
          path: dsh-managed-agent
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            dsh-managed-agent/pnpm-lock.yaml
            dsh-approve-for-me/pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Verify reviewed managed-agent source
        working-directory: dsh-approve-for-me
        env:
          MANAGED_AGENT_SOURCE: ${{ github.workspace }}/dsh-managed-agent
        run: node scripts/verify-managed-agent-source.mjs
      - name: Build approval fork from pinned host source
        working-directory: dsh-approve-for-me
        run: DSH_REPO="$GITHUB_WORKSPACE/deepseek-harness" npm run build:approval-fork
      - name: Verify the fork against the pinned host identity
        working-directory: dsh-approve-for-me
        run: node patch/dsh-user-approval/scripts/verify-target-host.mjs "$GITHUB_WORKSPACE/deepseek-harness" .build/dsh-user-approval-afm-0.1.2-alpha.2.tgz patch/dsh-user-approval/upstream.json
      - name: Verify managed-agent against the published host
        working-directory: dsh-managed-agent
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
      - name: Materialize the reviewed managed-agent artifact
        working-directory: dsh-approve-for-me
        env:
          MANAGED_AGENT_SOURCE: ${{ github.workspace }}/dsh-managed-agent
        run: pnpm run build:managed-artifact
      - name: Install approve-for-me exact closure
        working-directory: dsh-approve-for-me
        run: pnpm install --frozen-lockfile
      - name: Verify installed target and peer closure
        working-directory: dsh-approve-for-me
        run: |
          pnpm peers check
          pnpm run verify:installed-target-host
      - name: Check and package approve-for-me
        working-directory: dsh-approve-for-me
        run: |
          pnpm run check
          npm pack --dry-run --json > .build/npm-pack-dry-run.json
      - name: Verify published-artifact Profile install and restart
        working-directory: dsh-approve-for-me
        run: pnpm run profile:artifact-smoke
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-approve-for-me-target-host
          path: |
            dsh-approve-for-me/.build/dsh-user-approval-afm-0.1.2-alpha.2.tgz
            dsh-approve-for-me/.build/dsh-user-approval-afm-0.1.2-alpha.2.tgz.sha256
            dsh-approve-for-me/.build/npm-pack-dry-run.json
            dsh-approve-for-me/.artifacts/managed-agent/artifact.json
            dsh-approve-for-me/.build/profile-smoke/
