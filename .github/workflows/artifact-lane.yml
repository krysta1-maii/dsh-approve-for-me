name: artifact-lane
on:
  push:
  pull_request:

jobs:
  packed-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-approve-for-me
    steps:
      - name: Checkout approve-for-me
        uses: actions/checkout@v4
        with:
          path: dsh-approve-for-me
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - name: Checkout exact DSH host
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: cd5ef8148158c3a752a658978873241fdf8e2bbc
          path: deepseek-harness
      # managed-agent main is not an immutable pin. The build below still
      # refuses to pack unless main exactly matches the reviewed
      # managed-agent-source.lock.json, so a main drift fails the lane instead
      # of being silently promoted into an artifact.
      - name: Checkout reviewed managed-agent source
        uses: actions/checkout@v4
        with:
          repository: krysta1-maii/dsh-managed-agent
          ref: main
          path: dsh-managed-agent
      - name: Record managed source identity
        run: |
          { echo "managed_source_sha=$(git -C ../dsh-managed-agent rev-parse HEAD)"; } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --dir ../dsh-managed-agent run bootstrap:target-host
      - run: pnpm --dir ../dsh-managed-agent install --frozen-lockfile
      - run: pnpm --dir ../dsh-managed-agent run build
      - run: npm run build:approval-fork
      - run: node scripts/build-managed-artifact.mjs && cat .artifacts/managed-agent/artifact.json >> "$GITHUB_STEP_SUMMARY"
      - run: node scripts/bootstrap-target-host.mjs
      - name: Install run-resolved managed artifact
        run: pnpm install --no-frozen-lockfile
      - run: pnpm run check
      - run: pnpm run verify:approval-fork
      - run: pnpm run package:smoke
